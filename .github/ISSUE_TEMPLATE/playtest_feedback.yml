name: Playtest feedback
description: Share privacy-safe feedback after trying Open Shed
title: "[Playtest]: "
labels:
  - playtest
body:
  - type: markdown
    attributes:
      value: |
        Thanks for playtesting Open Shed. Tell us what felt smooth, confusing, or unreliable so we can improve it.

        **This form is public.** Do not include a live table code or join link, player identity, private hand, chat content, account data, authentication data, secret, or unredacted production log. Use invented names and describe the game state without identifying a real table.

  - type: input
    id: release
    attributes:
      label: Release and environment
      description: Include the Open Shed version, browser, operating system, and device type if known.
      placeholder: V1.6.3, Chrome on Android phone
    validations:
      required: true

  - type: dropdown
    id: group_size
    attributes:
      label: Number of players
      options:
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - I tested alone
        - Prefer not to say
    validations:
      required: true

  - type: textarea
    id: worked
    attributes:
      label: What worked well?
      description: Tell us what felt clear, fun, fast, or reliable.

  - type: textarea
    id: friction
    attributes:
      label: What was confusing or difficult?
      description: Describe the moment and the result using synthetic or redacted details.
    validations:
      required: true

  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility and device notes
      description: Note keyboard, screen-reader, motion, contrast, zoom, touch, audio, connection, or small-screen concerns.

  - type: textarea
    id: improvement
    attributes:
      label: What should we improve next?

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed live table details, player data, private game state, chat, authentication data, secrets, and sensitive logs from this public report.
          required: true
