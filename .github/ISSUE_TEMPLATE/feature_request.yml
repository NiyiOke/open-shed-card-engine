name: Feature request
description: Suggest an improvement to Open Shed
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the player problem first so contributors can compare possible solutions.

        This is a public form. Do not include live table codes or join links, player identities, private hands, chat content, authentication data, secrets, or sensitive logs.

  - type: textarea
    id: problem
    attributes:
      label: Player or contributor problem
      description: What is difficult today, and who experiences it?
      placeholder: When …, players or contributors cannot …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior. A solution sketch is welcome but not required.
      placeholder: It should be possible to …
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or other approaches you considered.

  - type: textarea
    id: implications
    attributes:
      label: Rules, privacy, security, and accessibility implications
      description: Call out any effect on game meaning, player data, abuse risk, or inclusive use. Write "None known" when there is none.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Game rules and engine
        - Multiplayer and realtime
        - Lobby, invitations, and presence
        - Chat and communication
        - Accessibility
        - User interface and visual design
        - Developer experience and documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include live table codes or join links, player identities, private hands, chat content, authentication data, secrets, or sensitive logs.
          required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help design or implement this feature.
          required: false
