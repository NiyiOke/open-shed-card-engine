version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      runtime-and-framework:
        applies-to: version-updates
        patterns:
          - "@types/react"
          - "@types/react-dom"
          - "livekit-*"
          - "react"
          - "react-dom"
          - "react-server-dom-webpack"
        update-types:
          - minor
          - patch
      tooling-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
          - "livekit-*"
          - "react"
          - "react-dom"
          - "react-server-dom-webpack"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Later Vinext prereleases currently exceed the initial-JS budget; see #11.
      - dependency-name: vinext
        versions:
          - ">=1.0.0-beta.7 <1.0.0"

  - package-ecosystem: npm
    directory: /realtime-worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      safe-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
